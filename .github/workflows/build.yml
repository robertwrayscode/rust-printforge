name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI build deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Read version
        shell: bash
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/RoboForge | Out-Null
          Copy-Item target/release/roboforge.exe dist/RoboForge/RoboForge.exe
          Copy-Item README.md dist/RoboForge/
          Compress-Archive -Path dist/RoboForge -DestinationPath "RoboForge-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: RoboForge-${{ env.VERSION }}-windows-x64
          path: RoboForge-${{ env.VERSION }}-windows-x64.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RoboForge-${{ env.VERSION }}-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - name: Read version
        shell: bash
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Universal app bundle
        run: |
          APP=dist/RoboForge.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/RoboForge" \
            target/aarch64-apple-darwin/release/roboforge \
            target/x86_64-apple-darwin/release/roboforge
          sed "s/0\.1\.0/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
          cd dist && ditto -c -k --keepParent RoboForge.app "../RoboForge-$VERSION-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: RoboForge-${{ env.VERSION }}-macos-universal
          path: RoboForge-${{ env.VERSION }}-macos-universal.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RoboForge-${{ env.VERSION }}-macos-universal.zip
