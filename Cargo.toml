[package]
name = "roboforge"
version = "1.11.1"
edition = "2024"
description = "Tinkercad-style 3D designer with colour export and print checking for Bambu Lab printers"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"

[dependencies]
arboard = { version = "3.7", default-features = false }
boolmesh = { version = "0.2.2", features = ["rayon"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
earcutr = "0.5.0"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.36"
epaint_default_fonts = "0.36"
glam = { version = "0.32", features = ["mint", "serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }
mint = "0.5.9"
png = "0.18.1"
qrcode = { version = "0.15.0", default-features = false }
quick-xml = "0.42.0"
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
transform-gizmo-egui = "0.11"
ttf-parser = "0.25.1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
usvg = "0.50.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
